<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>__APP_NAME__</title>
  <meta name="app-name" content="__APP_NAME__">
  <!-- SDK officiel : fournit window.Telegram.WebApp et les variables CSS du thème de l'utilisateur -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="center muted">Chargement de __APP_NAME__…</div>
  </main>
  <!-- Barre de secours : utilisée hors de Telegram (développement) ou si le bouton secondaire natif n'existe pas -->
  <div id="fallback-bar" class="fallback-bar" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
