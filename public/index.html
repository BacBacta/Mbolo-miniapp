<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>__APP_NAME__</title>
  <meta name="app-name" content="__APP_NAME__">
  <!-- SDK officiel : fournit window.Telegram.WebApp et les variables CSS du thème de l'utilisateur -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Deux polices : Instrument Serif pour l'identité (prénoms, titres, réponses), Manrope pour tout
       le reste. Environ 60 Ko la première fois, puis en cache. Chargées sans bloquer (media=print
       puis all) : l'app démarre avec les polices de secours, les vraies arrivent quand elles arrivent.
       Un réseau où Google Fonts traîne ne retarde donc jamais l'écran -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400..800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/styles.css?v=__ASSET_V__">
</head>
<body>
  <!-- Barre d'onglets persistante : construite une fois par app.js, affichée sur les écrans principaux -->
  <header id="topbar" class="topbar" hidden>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </header>
  <main id="app" aria-live="polite">
    <div class="boot"><span class="boot-mark">__APP_NAME__</span><span class="boot-sub">Chargement…</span></div>
  </main>
  <!-- Barre de secours : utilisée hors de Telegram (développement) ou si le bouton secondaire natif n'existe pas -->
  <div id="fallback-bar" class="fallback-bar" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <!-- ?v= : empreinte du contenu, posée par le serveur, pour que le cache ne serve pas une ancienne version -->
  <script type="module" src="/app.js?v=__ASSET_V__"></script>
</body>
</html>
