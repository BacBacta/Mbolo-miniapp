# Service Fly. Le nom de l'app est fixé au déploiement (flyctl deploy -a <nom>) :
# les noms sont uniques dans le monde entier, « mbolo » est probablement déjà pris.
app = "mbolo"
primary_region = "cdg"

[build]

# Dix secondes entre le signal d'arrêt et la coupure : le serveur ferme proprement (écriture
# différée du fichier, connexions PostgreSQL rendues) avant que la machine ne s'éteigne.
kill_timeout = "10s"
# De la mémoire de secours sur une machine de 256 Mo : un pic ne doit pas tuer le processus.
swap_size_mb = 256

[env]
  # Le nom affiché dans l'app, les messages du bot et les pages publiques.
  # Écrit ici plutôt que laissé au défaut de server/config.js : la production ne doit pas
  # changer de nom parce que quelqu'un a touché à une valeur par défaut.
  APP_NAME = "Odo"
  PORT = "8080"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  # Le quota du jour repart à minuit : minuit au Cameroun, pas minuit UTC
  TZ = "Africa/Douala"
  # Telegram appelle le serveur, au lieu que le bot aille chercher les messages
  USE_WEBHOOK = "true"
  # Profils de démonstration : à « true » pour une machine de démonstration, jamais pour de
  # vraies personnes, qui se retrouveraient à écrire à des profils qui n'existent pas.
  SEED_DEMO = "false"
  # Politique de mise en relation. « open » lève la règle femme/homme en relation sérieuse, et
  # c'est alors la personne qui dit quel genre elle cherche — sans quoi elle verrait des profils
  # qu'elle n'a pas demandés. Ce choix est une donnée d'orientation : la page de confidentialité
  # le dit sous cette politique (server/index.js, selonLaPolitique), il reste facultatif, et
  # « tout le monde » par défaut n'enregistre rien de personne.
  #
  # Le réglage est GLOBAL au serveur, pas par pays : cette instance l'applique à Yaoundé comme à
  # Bruxelles. Repasser à "romance_opposite" referme le choix, cesse de lire le champ, et rend à
  # la page de confidentialité sa promesse d'origine. Décision du propriétaire, 14 septembre 2026.
  MATCH_POLICY = "open"
  # Ce que la vérification par selfie décide. « badge » : on entre avec un profil, et le selfie
  # vérifié donne un bouclier sur la fiche — plus une porte, un signe. « gate » (le défaut) la
  # remet en porte : rien avant qu'un humain ait tranché.
  #
  # Pourquoi « badge » ici : la modération est humaine et l'équipe fait une personne. Sous
  # « gate », personne ne voit rien tant que ce modérateur n'a pas regardé, et un délai de
  # quelques heures la nuit vide l'app de tout le monde en même temps. Ce qui reste réservé au
  # bouclier est ce qui met deux personnes en présence : proposer un rendez-vous, des deux
  # côtés, et confirmer une arrivée — plus un quota de « J'aime » réduit tant qu'on ne l'a pas.
  # Les deux pages publiques portent les deux versions et n'en servent qu'une
  # (server/index.js, selonLaPolitique). Décision du propriétaire, 15 septembre 2026.
  VERIFICATION_POLICY = "badge"
  # AUTO_APPROVE n'est volontairement pas ici : NODE_ENV vaut production, et la validation
  # automatique des selfies y est éteinte quoi qu'on écrive (server/config.js). La modération
  # passe par ADMIN_CHAT_ID, posé en secret par deployer-fly.sh.

[http_service]
  internal_port = 8080
  force_https = true
  # La machine s'arrête quand personne ne s'en sert, et redémarre à la requête suivante
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Base JSON et photos : conservées d'un déploiement à l'autre
[[mounts]]
  source = "mbolo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
