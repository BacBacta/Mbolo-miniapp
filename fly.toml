# fly.toml app configuration file generated for mbolo-miniapp on 2026-09-11T16:54:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mbolo-miniapp'
primary_region = 'ams'

[build]

[env]
  AUTO_APPROVE = 'true'
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'
  SEED_DEMO = 'true'
  USE_WEBHOOK = 'true'

[[mounts]]
  source = 'mbolo_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
