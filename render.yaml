# Description du service pour Render (New, Blueprint). Voir README, « Tester dans Telegram sans tunnel ».
# L'offre gratuite suffit pour une bêta fermée : le disque y est effacé à chaque redéploiement.
services:
  - type: web
    name: mbolo
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Le quota du jour repart à minuit : minuit au Cameroun, pas minuit UTC
      - key: TZ
        value: Africa/Douala
      - key: USE_WEBHOOK
        value: "true"
      # Profils de démonstration : à « true » pour une machine de démonstration, jamais pour de
      # vraies personnes, qui se retrouveraient à écrire à des profils qui n'existent pas.
      - key: SEED_DEMO
        value: "false"
      # AUTO_APPROVE n'est volontairement pas ici : NODE_ENV vaut production, et la validation
      # automatique des selfies y est éteinte quoi qu'on écrive (server/config.js).
      # Groupe Telegram qui reçoit les selfies à valider. Sans lui, le serveur refuse de démarrer.
      - key: ADMIN_CHAT_ID
        sync: false
      # Demandé à la création : jamais dans Git
      - key: BOT_TOKEN
        sync: false
      # Généré par Render
      - key: ADMIN_KEY
        generateValue: true
