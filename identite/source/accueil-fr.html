<link rel="stylesheet" href="fonts/local2.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #08080f; color: #f2f0f7; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .fraunces { font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'opsz' 144, 'SOFT' 30, 'WONK' 0; }
  .manrope { font-family: 'Manrope', system-ui, sans-serif; }
  .grain { position: absolute; inset: 0; filter: url(#grain); opacity: .16; mix-blend-mode: overlay; pointer-events: none; }
</style><svg width="0" height="0" style="position:absolute"><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" seed="7"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope=".9"/></feComponentTransfer>
</filter></svg>
<style>
  body { width: 640px; height: 360px; position: relative;
         background: radial-gradient(circle at 78% 60%, #191627 0%, #0e0d17 38%, #08080f 75%); }
  
  .mk { position: absolute; z-index: 1; }
  .mk > div { position: absolute; inset: 0; border-radius: 50%; }
  /* halo sur la surface : la lumière de l'anneau se dépose sur l'encre */
  .mk .bloom { background: conic-gradient(from 210deg at 50% 50%, #ff3d81, #ff8a3d, #ffd34d, #7a5cff, #ff3d81); filter: blur(calc(var(--w) * 1.1)); opacity: .42; transform: scale(1.04); }
  /* le disque intérieur : encre légèrement bombée, ombre portée de l'anneau en haut à gauche */
  .mk .disc { inset: calc(var(--w) - 1px); background: radial-gradient(circle at 42% 34%, #16141f 0%, #0d0c15 55%, #09090f 100%);
              box-shadow: inset calc(var(--w) * .28) calc(var(--w) * .34) calc(var(--w) * .9) rgb(0 0 0 / .7),
                          inset 0 0 calc(var(--w) * 1.6) rgb(255 138 61 / .06); }
  /* la matière : le dégradé de l'app, tel quel */
  .mk .base { background: conic-gradient(from 210deg at 50% 50%, #ff3d81, #ff8a3d, #ffd34d, #7a5cff, #ff3d81); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--w) - .5px), #000 calc(100% - var(--w) + .5px)); }
  /* la lumière : clair en haut à gauche, sombre en bas à droite, sur le seul anneau */
  .mk .shade { background: linear-gradient(135deg, rgb(255 255 255 / .42) 0%, rgb(255 255 255 / .08) 34%, rgb(0 0 0 / 0) 50%, rgb(20 10 40 / .55) 78%, rgb(20 10 40 / .8) 100%);
               -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--w) - .5px), #000 calc(100% - var(--w) + .5px)); mix-blend-mode: soft-light; }
  /* le reflet : une bande le long de la ligne médiane du tore, sur le quart éclairé seulement */
  .mk .spec { background: #fff; opacity: .4;
              -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--w) * .85), #fff calc(100% - var(--w) * .62), #fff calc(100% - var(--w) * .42), transparent calc(100% - var(--w) * .15)),
                            conic-gradient(from 250deg, transparent 0deg, #000 30deg, #000 70deg, transparent 110deg);
              -webkit-mask-composite: source-in; mix-blend-mode: overlay; }
  /* la lisière : un filet clair sur le bord extérieur éclairé, un filet sombre sur le bord intérieur */
  .mk .rim { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .18), 0 0 0 1px rgb(0 0 0 / .35); -webkit-mask: linear-gradient(135deg, #000 0%, #000 45%, transparent 75%); }
  /* l'ombre que le tore porte sur la surface, du côté opposé à la lumière */
  .mk .cast { background: rgb(0 0 0 / .55); filter: blur(calc(var(--w) * .8)); transform: translate(calc(var(--w) * .35), calc(var(--w) * .45)) scale(1.02); z-index: -1; }

  /* le second cercle : l'autre personne, tracée au filet, tangent au premier — la rencontre est le point de contact */
  .other { position: absolute; z-index: 0; border-radius: 50%; border: 1.5px solid rgb(242 240 247 / .22);
           box-shadow: inset 0 0 0 1px rgb(242 240 247 / .04), 0 0 60px rgb(255 138 61 / .06); }
  .other::after { content: ''; position: absolute; inset: -1.5px; border-radius: 50%;
                  border: 1.5px solid transparent; border-top-color: rgb(255 211 77 / .55); border-left-color: rgb(255 138 61 / .35);
                  -webkit-mask: linear-gradient(160deg, #000 0%, #000 35%, transparent 60%); }
  /* la lumière au point de contact */
  .touch { position: absolute; z-index: 2; border-radius: 50%;
           background: radial-gradient(circle, rgb(255 211 77 / .55) 0%, rgb(255 138 61 / .25) 30%, transparent 70%); filter: blur(6px); mix-blend-mode: screen; }
  .col { position: absolute; left: 44px; top: 42px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .n { font-size: 21px; letter-spacing: .005em; font-weight: 400; color: rgb(242 240 247 / .92); }
  .brand .sep { width: 1px; height: 14px; background: rgb(242 240 247 / .25); margin: 0 2px; }
  .brand .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgb(242 240 247 / .55); }
  .h { margin-top: 30px; font-size: 47px; line-height: .98; letter-spacing: -.022em; font-weight: 300; color: #f4f2f8;
       text-shadow: 0 2px 30px rgb(0 0 0 / .5); }
  .h em { font-style: italic; font-weight: 300; font-variation-settings: 'opsz' 144, 'SOFT' 60, 'WONK' 1;
          background: linear-gradient(100deg, #ffd34d 0%, #ff8a3d 45%, #ff3d81 100%); -webkit-background-clip: text; color: transparent; }
  .age { position: absolute; left: 44px; bottom: 40px; font-size: 11px; font-weight: 700; letter-spacing: .12em;
         padding: 5px 8px 4px; border-radius: 5px; border: 1px solid rgb(242 240 247 / .22); color: rgb(242 240 247 / .62); }
</style>

<div class="mk " style="left:370.0px; top:64.0px; width:300px; height:300px; --w:38px">
  <div class="bloom"></div>
  <div class="disc"></div>
  <div class="base"></div>
  <div class="shade"></div>
  <div class="spec"></div>
  <div class="rim"></div>
  <div class="cast"></div>
</div>
<div class="other" style="left:205px; top:185px; width:172px; height:172px"></div>
<div class="touch" style="left:334px; top:210px; width:80px; height:80px"></div>
<div class="col">
  <div class="brand"><span class="n fraunces">Odo</span><span class="sep"></span><span class="eyebrow manrope">Rencontres vérifiées</span></div>
  <div class="h fraunces">Des rencontres<br>vérifiées,<br><em>face à face.</em></div>
</div>
<div class="age manrope">18+</div>
<div class="grain"></div>
