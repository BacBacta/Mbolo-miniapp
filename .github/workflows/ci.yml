# Intégration continue : les tests tournent sur chaque pull request et sur chaque poussée vers
# main, en Node 20 et 22, les deux versions que le projet annonce prendre en charge.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Vérifier les vulnérabilités connues
        run: npm audit --audit-level=high

  # La même suite, mais sur PostgreSQL : c'est le stockage de production depuis P0-2, et rien ne
  # garantit qu'un code qui passe sur le fichier JSON passe aussi sur la base (objets partagés en
  # mémoire d'un côté, copies relues de l'autre). Une seule version de Node suffit ici : c'est le
  # stockage qu'on vérifie, pas le moteur.
  postgres:
    name: PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mbolo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests sur PostgreSQL
        run: npm run test:pg
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mbolo_test

  # Le parcours dans un vrai navigateur : ce que `npm test` ne peut pas dire — qu'un écran
  # s'affiche, qu'un bouton existe, que le clavier ne se ferme pas quand un message arrive.
  # Lent, donc peu de cas : les chemins qui coûteraient cher à casser, pas chaque cas limite.
  e2e:
    name: Parcours navigateur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Seul Chromium : la cible est un Android d'entrée de gamme, et chaque navigateur en plus
      # coûte une minute d'installation à chaque exécution.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests de bout en bout
        run: npm run e2e

      # Les traces et captures ne sont produites qu'en cas d'échec : elles disent ce que la
      # personne voyait au moment où ça a cassé, ce qu'un journal ne montre jamais.
      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
