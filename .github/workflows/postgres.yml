# Bascule de la production vers PostgreSQL, depuis l'onglet Actions de GitHub.
# Pensé pour être lancé depuis un navigateur de téléphone : aucune ligne de commande.
#
# Deux lancements, dans cet ordre :
#   1. « preparer » : crée la base si tu le demandes, l'attache sous un nom que le serveur
#      ignore, reprend /data/db.json et vérifie que rien ne manque. La production ne bouge pas.
#   2. « basculer » : refait le contrôle, puis échange les noms. C'est le seul moment où la
#      production change de stockage, et il dure un redémarrage.
# « verifier » se lance quand tu veux : il ne fait que lire.
#
# Créer une base demande un jeton d'organisation (fly.io, Account puis Tokens) : le jeton de
# déploiement qui suffit à mettre l'app en ligne ne voit aucune organisation.
#
# Deux secrets possibles, dans cet ordre : FLY_ORG_TOKEN s'il existe, sinon FLY_API_TOKEN.
# Poser FLY_ORG_TOKEN à côté est le plus sain — le déploiement garde son jeton limité à l'app,
# et seul ce travail-ci reçoit les droits étendus. Une fois la bascule faite, il se supprime.
name: PostgreSQL

on:
  workflow_dispatch:
    inputs:
      etape:
        description: "Étape"
        required: true
        type: choice
        default: verifier
        options: [verifier, preparer, basculer]
      app_name:
        description: "Nom de l'app Fly"
        required: true
        default: mbolo-miniapp
      db_name:
        description: "Nom du cluster PostgreSQL"
        required: true
        default: mbolo-db
      region:
        description: "Région (ams Amsterdam, cdg Paris, jnb Johannesburg, mad Madrid)"
        required: true
        default: ams
      creer_la_base:
        description: "Créer la base si elle n'existe pas (dépense mensuelle)"
        type: boolean
        default: false
      moteur:
        description: "mpg : gérée par Fly, sauvegardes comprises. brut : moins chère, reprise à ta charge"
        required: true
        type: choice
        default: mpg
        options: [mpg, brut]

# Deux bascules en même temps écriraient dans la même base : une seule à la fois.
concurrency: postgres-${{ inputs.app_name }}

# Lire le dépôt suffit.
permissions:
  contents: read

jobs:
  bascule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # flyctl à version fixe, installé par le script officiel : une action tierce suivie sur sa
      # branche « master » s'exécutait avec tous les secrets du dépôt, et pouvait changer sans
      # que personne ici ne le voie (audit/09-revue-code.md, I10).
      - name: Installer flyctl
        env:
          FLYCTL_VERSION: '0.4.102'
        run: |
          curl -fsSL https://fly.io/install.sh | sh -s "$FLYCTL_VERSION"
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: ${{ inputs.etape }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}
          CREER_LA_BASE: ${{ inputs.creer_la_base }}
          MOTEUR: ${{ inputs.moteur }}
          ETAPE: ${{ inputs.etape }}
          APP_NAME: ${{ inputs.app_name }}
          DB_NAME: ${{ inputs.db_name }}
          REGION: ${{ inputs.region }}
        # Même script que pour une bascule à la main : une seule logique à maintenir. Les entrées
        # passent par l'environnement et sont vérifiées avant d'entrer dans une commande.
        run: |
          for v in "$ETAPE" "$APP_NAME" "$DB_NAME" "$REGION"; do
            case "$v" in ''|*[!a-z0-9-]*) echo "Entrée invalide : $v" >&2; exit 1;; esac
          done
          ./basculer-postgres.sh "$ETAPE" "$APP_NAME" "$DB_NAME" "$REGION"
