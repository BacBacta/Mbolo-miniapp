# Déploiement sur Fly, déclenché à la main depuis l'onglet Actions de GitHub.
# Pensé pour être lancé depuis un navigateur de téléphone : aucune ligne de commande.
#
# À faire une seule fois avant le premier lancement :
#   1. créer un compte sur https://fly.io, puis un jeton dans Account, Tokens ;
#   2. sur GitHub, Settings, Secrets and variables, Actions, ajouter :
#      FLY_API_TOKEN (obligatoire), BOT_TOKEN (obligatoire), ADMIN_KEY (recommandé).
name: Déployer sur Fly

on:
  workflow_dispatch:
    inputs:
      # Ces valeurs par défaut sont celles de l'app réellement déployée : le bouton « Run
      # workflow » se lance sans rien saisir, ce qui est tout l'intérêt depuis un téléphone.
      # Les changer ici veut dire déployer ailleurs — vérifie que l'app existe.
      app_name:
        description: "Nom de l'app Fly, unique dans le monde entier"
        required: true
        default: mbolo-miniapp
      region:
        description: "Région (ams Amsterdam, cdg Paris, jnb Johannesburg, mad Madrid)"
        required: true
        default: ams

concurrency: deploy-fly

# Lire le dépôt suffit : le déploiement parle à Fly, pas à GitHub.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # flyctl à version fixe, installé par le script officiel : une action tierce suivie sur sa
      # branche « master » s'exécutait avec tous les secrets du dépôt, et pouvait changer sans
      # que personne ici ne le voie (audit/09-revue-code.md, I10).
      - name: Installer flyctl
        env:
          FLYCTL_VERSION: '0.4.102'
        run: |
          curl -fsSL https://fly.io/install.sh | sh -s "$FLYCTL_VERSION"
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Déployer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET }}
          # Les entrées passent par l'environnement et sont vérifiées : insérées telles quelles
          # dans une commande, une apostrophe suffisait à y glisser autre chose.
          APP_NAME: ${{ inputs.app_name }}
          REGION: ${{ inputs.region }}
        # Même script que pour un déploiement à la main : une seule logique à maintenir
        run: |
          case "$APP_NAME" in ''|*[!a-z0-9-]*) echo "Nom d'app invalide : $APP_NAME" >&2; exit 1;; esac
          case "$REGION" in ''|*[!a-z]*) echo "Région invalide : $REGION" >&2; exit 1;; esac
          ./deployer-fly.sh "$APP_NAME" "$REGION"

      - name: Adresse de l'app
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: echo "Mini app disponible sur https://$APP_NAME.fly.dev"
